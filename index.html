<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ödevio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f7faf8;
    --surface: #ffffff;
    --surface-2: #f0f5f2;
    --text: #1d2924;
    --muted: #84918b;
    --border: #e4ebe7;

    --primary: #69a98c;
    --primary-dark: #4e8e72;
    --primary-soft: #e2f1ea;

    --danger: #e26d6d;

    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;

    --shadow: 0 12px 40px rgba(35, 62, 49, .07);
}

body.theme-pink {
    --primary: #d889a5;
    --primary-dark: #c36c8d;
    --primary-soft: #f8e5ed;
    --bg: #fcf7f9;
}

body.theme-blue {
    --primary: #6d9fc8;
    --primary-dark: #5285b1;
    --primary-soft: #e2eff8;
    --bg: #f6f9fc;
}

body.theme-green {
    --primary: #69a98c;
    --primary-dark: #4e8e72;
    --primary-soft: #e2f1ea;
    --bg: #f7faf8;
}

body.theme-yellow {
    --primary: #d5ad51;
    --primary-dark: #bb9137;
    --primary-soft: #f8f0d9;
    --bg: #fcfaf4;
}

body.theme-orange {
    --primary: #df9562;
    --primary-dark: #c87947;
    --primary-soft: #fae9dc;
    --bg: #fcf8f5;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", sans-serif;
    transition: background .25s ease, color .25s ease;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(1180px, calc(100% - 36px));
    margin: auto;
    padding: 28px 0 60px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-image {
    width: 46px;
    height: 46px;
    object-fit: contain;
}

.brand-name {
    font-family: "Manrope", sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1.3px;
}

.brand-name span {
    color: var(--primary);
}

.header-actions {
    position: relative;
}

.theme-button {
    width: 48px;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--surface);
    display: grid;
    place-items: center;
    transition: .2s;
}

.theme-button:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
}

.theme-button img {
    width: 25px;
    height: 25px;
    object-fit: contain;
}

/* THEME MENU */

.theme-menu {
    position: absolute;
    right: 0;
    top: 58px;
    width: 185px;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 17px;
    box-shadow: var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-7px);
    transition: .2s;
    z-index: 50;
}

.theme-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.theme-choice {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--text);
    text-align: left;
}

.theme-choice:hover {
    background: var(--surface-2);
}

.theme-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
}

.dot-pink { background: #d889a5; }
.dot-blue { background: #6d9fc8; }
.dot-green { background: #69a98c; }
.dot-yellow { background: #d5ad51; }
.dot-orange { background: #df9562; }

/* WELCOME */

.welcome {
    margin-bottom: 24px;
}

.welcome h1 {
    font-family: "Manrope", sans-serif;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -1.5px;
    margin-bottom: 6px;
}

.welcome p {
    color: var(--muted);
    font-size: 15px;
}

/* DASHBOARD */

.dashboard {
    display: grid;
    grid-template-columns: 1.4fr .6fr;
    gap: 18px;
    margin-bottom: 30px;
}

.progress-card {
    position: relative;
    overflow: hidden;
    min-height: 205px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 28px;
    box-shadow: var(--shadow);
}

.progress-card::after {
    content: "";
    position: absolute;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background: var(--primary-soft);
    right: -80px;
    bottom: -120px;
}

.progress-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

.progress-number {
    font-family: "Manrope", sans-serif;
    font-size: 48px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--primary-dark);
}

.progress-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 9px;
}

.progress-track {
    height: 11px;
    width: 100%;
    background: var(--primary-soft);
    border-radius: 30px;
    overflow: hidden;
    margin-top: 25px;
}

.progress-fill {
    width: 0;
    height: 100%;
    background: var(--primary);
    border-radius: inherit;
    transition: width .5s cubic-bezier(.22,1,.36,1);
}

.stat-card {
    background: var(--primary);
    color: white;
    border-radius: var(--radius-xl);
    padding: 27px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 205px;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stat-title {
    font-size: 14px;
    opacity: .85;
}

.stat-image {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.stat-number {
    font-family: "Manrope", sans-serif;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -2px;
}

.stat-bottom {
    font-size: 13px;
    opacity: .82;
}

/* TOOLBAR */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-title {
    font-family: "Manrope", sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.add-button {
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: var(--primary);
    color: white;
    padding: 12px 17px;
    border-radius: 13px;
    font-size: 13px;
    font-weight: 700;
    transition: .2s;
}

.add-button:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.add-button img {
    width: 17px;
    height: 17px;
    object-fit: contain;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 17px;
}

.select-wrapper {
    position: relative;
}

.select-wrapper select {
    appearance: none;
    min-width: 175px;
    padding: 12px 38px 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-size: 13px;
}

.select-wrapper::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
}

/* TASKS */

.task-list {
    display: grid;
    gap: 11px;
}

.task {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 17px 19px;
    transition: .2s;
}

.task:hover {
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(0,0,0,.045);
}

.task.completed {
    opacity: .62;
}

.check-button {
    flex: 0 0 25px;
    width: 25px;
    height: 25px;
    border-radius: 8px;
    border: 2px solid var(--primary);
    background: transparent;
    display: grid;
    place-items: center;
    transition: .2s;
}

.check-button.checked {
    background: var(--primary);
}

.check-button img {
    width: 15px;
    height: 15px;
    object-fit: contain;
}

.task-info {
    flex: 1;
    min-width: 0;
}

.task-name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.completed .task-name {
    text-decoration: line-through;
}

.task-details {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.subject-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    border-radius: 7px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 11px;
    font-weight: 700;
}

.subject-tag img {
    width: 15px;
    height: 15px;
    object-fit: contain;
}

.deadline {
    color: var(--muted);
    font-size: 11px;
}

.deadline.urgent {
    color: var(--danger);
    font-weight: 700;
}

.delete-button {
    border: none;
    background: transparent;
    padding: 7px;
    opacity: .5;
}

.delete-button:hover {
    opacity: 1;
}

.delete-button img {
    width: 18px;
    height: 18px;
    object-fit: contain;
}

/* EMPTY */

.empty-state {
    text-align: center;
    padding: 60px 20px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 20px;
}

.empty-state img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 15px;
}

.empty-state h3 {
    font-size: 17px;
    margin-bottom: 5px;
}

.empty-state p {
    color: var(--muted);
    font-size: 13px;
}

/* MODAL */

.modal-background {
    position: fixed;
    inset: 0;
    background: rgba(19, 27, 24, .42);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: .2s;
    z-index: 100;
}

.modal-background.open {
    opacity: 1;
    visibility: visible;
}

.modal {
    width: min(470px, 100%);
    background: var(--surface);
    border-radius: 25px;
    padding: 27px;
    box-shadow: 0 25px 80px rgba(0,0,0,.18);
    transform: translateY(12px) scale(.98);
    transition: .25s;
}

.modal-background.open .modal {
    transform: translateY(0) scale(1);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 23px;
}

.modal-title {
    font-family: "Manrope", sans-serif;
    font-size: 22px;
    font-weight: 800;
}

.close-button {
    width: 35px;
    height: 35px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 10px;
    font-size: 19px;
}

.form-group {
    margin-bottom: 17px;
}

.form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 7px;
}

.form-input,
.form-select {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-size: 14px;
}

.form-input:focus,
.form-select:focus {
    border-color: var(--primary);
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 23px;
}

.cancel-button,
.save-button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
}

.cancel-button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
}

.save-button {
    border: none;
    background: var(--primary);
    color: white;
}

/* RESPONSIVE */

@media (max-width: 760px) {

    .app {
        width: min(100% - 24px, 600px);
        padding-top: 18px;
    }

    .header {
        margin-bottom: 25px;
    }

    .dashboard {
        grid-template-columns: 1fr;
    }

    .stat-card {
        min-height: 145px;
    }

    .progress-card {
        min-height: 190px;
    }

    .section-header {
        align-items: flex-end;
        gap: 12px;
    }

    .add-button {
        padding: 11px 13px;
    }

    .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .select-wrapper select {
        width: 100%;
        min-width: 0;
    }
}

@media (max-width: 450px) {

    .welcome h1 {
        font-size: 29px;
    }

    .brand-name {
        font-size: 25px;
    }

    .toolbar {
        grid-template-columns: 1fr;
    }

    .section-header {
        align-items: center;
    }

    .task {
        padding: 15px;
        gap: 11px;
    }

    .task-name {
        font-size: 14px;
    }

    .delete-button {
        padding: 4px;
    }
}
</style>
</head>

<body class="theme-green">

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <img
                id="logoImage"
                src="images/logo.png"
                class="brand-image"
                alt=""
                onerror="this.style.display='none'"
            >

            <div class="brand-name">
                ödev<span>io</span>
            </div>

        </div>

        <div class="header-actions">

            <button
                class="theme-button"
                onclick="toggleThemeMenu()"
                aria-label="Tema seç"
            >
                <img
                    id="themeImage"
                    src="images/1.png"
                    alt=""
                >
            </button>

            <div class="theme-menu" id="themeMenu">

                <button class="theme-choice" onclick="setTheme('pink')">
                    <span class="theme-dot dot-pink"></span>
                    Pembe
                </button>

                <button class="theme-choice" onclick="setTheme('blue')">
                    <span class="theme-dot dot-blue"></span>
                    Mavi
                </button>

                <button class="theme-choice" onclick="setTheme('green')">
                    <span class="theme-dot dot-green"></span>
                    Yeşil
                </button>

                <button class="theme-choice" onclick="setTheme('yellow')">
                    <span class="theme-dot dot-yellow"></span>
                    Sarı
                </button>

                <button class="theme-choice" onclick="setTheme('orange')">
                    <span class="theme-dot dot-orange"></span>
                    Turuncu
                </button>

            </div>

        </div>

    </header>


    <!-- WELCOME -->

    <section class="welcome">

        <h1>Ödevlerin burada.</h1>

        <p>
            Bugünkü işlerini takip et, ilerlemeni gör.
        </p>

    </section>


    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="progress-card">

            <div class="progress-label">
                Genel ilerleme
            </div>

            <div
                class="progress-number"
                id="progressNumber"
            >
                0%
            </div>

            <div
                class="progress-subtitle"
                id="progressText"
            >
                Henüz tamamlanan ödev yok.
            </div>

            <div class="progress-track">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <div class="stat-title">
                    Kalan ödev
                </div>

                <img
                    id="statImage"
                    src="images/3.png"
                    class="stat-image"
                    alt=""
                >

            </div>

            <div
                class="stat-number"
                id="remainingCount"
            >
                0
            </div>

            <div class="stat-bottom">
                Tamamladıkça burası azalır.
            </div>

        </div>

    </section>


    <!-- TASK SECTION -->

    <section>

        <div class="section-header">

            <div class="section-title">
                Ödevler
            </div>

            <button
                class="add-button"
                onclick="openModal()"
            >
                <img
                    id="addImage"
                    src="images/2.png"
                    alt=""
                >
                Ödev ekle
            </button>

        </div>


        <!-- FILTERS -->

        <div class="toolbar">

            <div class="select-wrapper">

                <select
                    id="subjectFilter"
                    onchange="renderTasks()"
                >
                    <option value="all">Tüm dersler</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Seçmeli Matematik">Seçmeli Matematik</option>
                    <option value="Türkçe">Türkçe</option>
                    <option value="Fen Bilimleri">Fen Bilimleri</option>
                    <option value="İnkılap">İnkılap</option>
                    <option value="İngilizce">İngilizce</option>
                </select>

            </div>


            <div class="select-wrapper">

                <select
                    id="sortFilter"
                    onchange="renderTasks()"
                >
                    <option value="nearest">
                        Son teslim: en yakın
                    </option>

                    <option value="furthest">
                        Son teslim: en uzak
                    </option>

                    <option value="newest">
                        Eklenme: en yeni
                    </option>

                    <option value="oldest">
                        Eklenme: en eski
                    </option>

                </select>

            </div>

        </div>


        <div
            class="task-list"
            id="taskList"
        ></div>

    </section>

</div>


<!-- ADD MODAL -->

<div
    class="modal-background"
    id="modal"
    onclick="backgroundClose(event)"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                Yeni ödev
            </div>

            <button
                class="close-button"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label class="form-label">
                Ödev adı
            </label>

            <input
                class="form-input"
                id="taskTitle"
                type="text"
                placeholder="Örn. 40 soru paragraf"
                maxlength="120"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Ders
            </label>

            <select
                class="form-select"
                id="taskSubject"
            >
                <option>Matematik</option>
                <option>Seçmeli Matematik</option>
                <option>Türkçe</option>
                <option>Fen Bilimleri</option>
                <option>İnkılap</option>
                <option>İngilizce</option>
            </select>

        </div>


        <div class="form-group">

            <label class="form-label">
                Son teslim tarihi
            </label>

            <input
                class="form-input"
                id="taskDate"
                type="date"
            >

        </div>


        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="closeModal()"
            >
                Vazgeç
            </button>

            <button
                class="save-button"
                onclick="addTask()"
            >
                Ödevi ekle
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY = "odevio_tasks_v2";
const THEME_KEY = "odevio_theme";

let tasks = loadTasks();

let currentTheme =
    localStorage.getItem(THEME_KEY) || "green";


/*
    YEŞİL TEMADA DOSYA ADINDA ÖN EK YOK.

    Yeşil:
    logo.png
    1.png
    2.png
    3.png
    ...

    Pembe:
    pembe-logo.png
    pembe-1.png
    pembe-2.png
    ...

    Mavi:
    mavi-logo.png
    mavi-1.png
    ...

    Sarı:
    sari-logo.png
    sari-1.png
    ...

    Turuncu:
    turuncu-logo.png
    turuncu-1.png
    ...
*/

const themePrefixes = {
    green: "",
    pink: "pembe-",
    blue: "mavi-",
    yellow: "sari-",
    orange: "turuncu-"
};


function getImage(number) {

    const prefix =
        themePrefixes[currentTheme];

    return `images/${prefix}${number}.png`;

}


function getLogoImage() {

    const prefix =
        themePrefixes[currentTheme];

    return `images/${prefix}logo.png`;

}


/*
    DERS İKONLARININ NUMARALARI
*/

const subjectImageNumbers = {

    "Matematik": 4,

    "Seçmeli Matematik": 5,

    "Türkçe": 6,

    "Fen Bilimleri": 7,

    "İnkılap": 8,

    "İngilizce": 9

};


/*
    TÜM TEMA GÖRSELLERİNİ GÜNCELLE
    PNG'LERİN KONUMU DEĞİŞMEZ.
*/

function updateThemeImages() {

    document
        .getElementById("logoImage")
        .src = getLogoImage();


    document
        .getElementById("themeImage")
        .src = getImage(1);


    document
        .getElementById("addImage")
        .src = getImage(2);


    document
        .getElementById("statImage")
        .src = getImage(3);


    renderTasks();

}


/*
    STORAGE
*/

function loadTasks() {

    try {

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    } catch {

        return [];

    }

}


function saveTasks() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
    );

}


/*
    MODAL
*/

function openModal() {

    document
        .getElementById("modal")
        .classList.add("open");


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    document
        .getElementById("taskDate")
        .value = today;


    setTimeout(() => {

        document
            .getElementById("taskTitle")
            .focus();

    }, 150);

}


function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("open");


    document
        .getElementById("taskTitle")
        .value = "";

}


function backgroundClose(event) {

    if (
        event.target ===
        document.getElementById("modal")
    ) {

        closeModal();

    }

}


/*
    ADD TASK
*/

function addTask() {

    const title =
        document
            .getElementById("taskTitle")
            .value
            .trim();


    const subject =
        document
            .getElementById("taskSubject")
            .value;


    const date =
        document
            .getElementById("taskDate")
            .value;


    if (!title) {

        document
            .getElementById("taskTitle")
            .focus();

        return;

    }


    if (!date) {

        alert(
            "Lütfen son teslim tarihini seç."
        );

        return;

    }


    tasks.push({

        id: Date.now(),

        title,

        subject,

        date,

        completed: false,

        createdAt: Date.now()

    });


    saveTasks();

    closeModal();

    renderTasks();

}


/*
    TOGGLE
*/

function toggleTask(id) {

    const task =
        tasks.find(
            item => item.id === id
        );


    if (!task) return;


    task.completed =
        !task.completed;


    saveTasks();

    renderTasks();

}


/*
    DELETE
*/

function deleteTask(id) {

    tasks =
        tasks.filter(
            item => item.id !== id
        );


    saveTasks();

    renderTasks();

}


/*
    DATE
*/

function dateValue(date) {

    return new Date(
        date + "T00:00:00"
    ).getTime();

}


function formatDate(date) {

    return new Date(
        date + "T00:00:00"
    ).toLocaleDateString(
        "tr-TR",
        {
            day: "numeric",
            month: "long"
        }
    );

}


function getDaysLeft(date) {

    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const target =
        new Date(
            date + "T00:00:00"
        );


    return Math.ceil(
        (target - today) /
        86400000
    );

}


function deadlineText(date) {

    const days =
        getDaysLeft(date);


    if (days < 0) {

        return "Süresi geçti";

    }


    if (days === 0) {

        return "Bugün";

    }


    if (days === 1) {

        return "Yarın";

    }


    return `${days} gün kaldı`;

}


/*
    RENDER
*/

function renderTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    const selectedSubject =
        document
            .getElementById("subjectFilter")
            .value;


    const sort =
        document
            .getElementById("sortFilter")
            .value;


    let filtered =
        [...tasks];


    if (
        selectedSubject !== "all"
    ) {

        filtered =
            filtered.filter(
                task =>
                    task.subject ===
                    selectedSubject
            );

    }


    if (sort === "nearest") {

        filtered.sort(
            (a, b) =>
                dateValue(a.date) -
                dateValue(b.date)
        );

    }


    if (sort === "furthest") {

        filtered.sort(
            (a, b) =>
                dateValue(b.date) -
                dateValue(a.date)
        );

    }


    if (sort === "newest") {

        filtered.sort(
            (a, b) =>
                b.createdAt -
                a.createdAt
        );

    }


    if (sort === "oldest") {

        filtered.sort(
            (a, b) =>
                a.createdAt -
                b.createdAt
        );

    }


    if (filtered.length === 0) {

        list.innerHTML = `

            <div class="empty-state">

                <img
                    src="${getImage(10)}"
                    alt=""
                >

                <h3>
                    Burada henüz bir şey yok
                </h3>

                <p>
                    ${
                        tasks.length === 0
                        ? "İlk ödevini ekleyerek başlayabilirsin."
                        : "Bu filtreye uygun ödev bulunamadı."
                    }
                </p>

            </div>

        `;


        updateStats();

        return;

    }


    list.innerHTML =
        filtered
            .map(task => {

                const image =
                    getImage(
                        subjectImageNumbers[
                            task.subject
                        ]
                    );


                const days =
                    getDaysLeft(
                        task.date
                    );


                const urgent =
                    !task.completed &&
                    days <= 1;


                return `

                    <article
                        class="task ${
                            task.completed
                            ? "completed"
                            : ""
                        }"
                    >

                        <button
                            class="check-button ${
                                task.completed
                                ? "checked"
                                : ""
                            }"
                            onclick="toggleTask(${task.id})"
                            aria-label="Tamamlandı"
                        >

                            ${
                                task.completed
                                ? `
                                    <img
                                        src="${getImage(11)}"
                                        alt=""
                                    >
                                `
                                : ""
                            }

                        </button>


                        <div class="task-info">

                            <div class="task-name">

                                ${escapeHTML(
                                    task.title
                                )}

                            </div>


                            <div class="task-details">

                                <span
                                    class="subject-tag"
                                >

                                    <img
                                        src="${image}"
                                        alt=""
                                    >

                                    ${escapeHTML(
                                        task.subject
                                    )}

                                </span>


                                <span
                                    class="deadline ${
                                        urgent
                                        ? "urgent"
                                        : ""
                                    }"
                                >

                                    ${formatDate(
                                        task.date
                                    )}

                                    ·

                                    ${deadlineText(
                                        task.date
                                    )}

                                </span>

                            </div>

                        </div>


                        <button
                            class="delete-button"
                            onclick="deleteTask(${task.id})"
                            aria-label="Ödevi sil"
                        >

                            <img
                                src="${getImage(12)}"
                                alt=""
                            >

                        </button>

                    </article>

                `;

            })
            .join("");


    updateStats();

}


/*
    STATS
*/

function updateStats() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task =>
                task.completed
        ).length;


    const remaining =
        total - completed;


    const percentage =
        total === 0
        ? 0
        : Math.round(
            (completed / total) * 100
        );


    document
        .getElementById(
            "progressNumber"
        )
        .textContent =
        percentage + "%";


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percentage + "%";


    document
        .getElementById(
            "remainingCount"
        )
        .textContent =
        remaining;


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        total === 0
        ? "Henüz tamamlanan ödev yok."
        : `${completed} / ${total} ödev tamamlandı`;

}


/*
    THEMES
*/

function toggleThemeMenu() {

    document
        .getElementById(
            "themeMenu"
        )
        .classList.toggle(
            "open"
        );

}


function setTheme(theme) {

    currentTheme = theme;


    document.body.className =
        "theme-" + theme;


    localStorage.setItem(
        THEME_KEY,
        theme
    );


    document
        .getElementById(
            "themeMenu"
        )
        .classList.remove(
            "open"
        );


    /*
        BURADA SADECE PNG'LERİN DOSYASI
        DEĞİŞİYOR.
        YERLERİ DEĞİŞMİYOR.
    */

    updateThemeImages();

}


/*
    SAVED THEME
*/

document.body.className =
    "theme-" + currentTheme;


/*
    ESC
*/

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/*
    HTML SECURITY
*/

function escapeHTML(text) {

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        text;


    return element.innerHTML;

}


/*
    START
*/

updateThemeImages();

</script>

</body>
</html>
