<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ödevio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7f8;
    --card: #ffffff;
    --text: #263238;
    --muted: #78909c;
    --primary: #4f8f78;
    --primary-light: #dff0e9;
    --border: #e5e9e8;
    --danger: #e57373;
    --shadow: 0 8px 25px rgba(0,0,0,.06);
}

body.dark {
    --bg: #171b1a;
    --card: #222827;
    --text: #f1f5f3;
    --muted: #9aaba5;
    --primary: #78b99e;
    --primary-light: #294438;
    --border: #343d3a;
    --shadow: 0 8px 25px rgba(0,0,0,.2);
}

body.blue {
    --primary: #5795c8;
    --primary-light: #e0effb;
}

body.purple {
    --primary: #8b75bd;
    --primary-light: #eee8fa;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: .25s;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

/* HEADER */

header {
    padding: 28px 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--primary);
}

.header-right {
    display: flex;
    gap: 10px;
}

.icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 12px;
    width: 43px;
    height: 43px;
    cursor: pointer;
    font-size: 19px;
}

/* PROGRESS */

.progress-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.progress-title {
    font-size: 17px;
    font-weight: 700;
}

.percent {
    font-size: 25px;
    font-weight: 800;
    color: var(--primary);
}

.progress-bar {
    height: 13px;
    background: var(--primary-light);
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    border-radius: 20px;
    transition: width .4s ease;
}

.progress-info {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

select,
input {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
}

select:focus,
input:focus {
    border-color: var(--primary);
}

.add-btn {
    border: none;
    background: var(--primary);
    color: white;
    border-radius: 13px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

/* TASKS */

#taskList {
    display: grid;
    gap: 13px;
    padding-bottom: 40px;
}

.task {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: var(--shadow);
    transition: .2s;
}

.task.completed {
    opacity: .62;
}

.check {
    width: 25px;
    height: 25px;
    min-width: 25px;
    border: 2px solid var(--primary);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
}

.completed .check {
    background: var(--primary);
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 7px;
}

.completed .task-title {
    text-decoration: line-through;
}

.task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.subject {
    font-size: 12px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 5px 9px;
    border-radius: 8px;
    font-weight: 700;
}

.date {
    font-size: 12px;
    color: var(--muted);
}

.delete {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
}

.delete:hover {
    color: var(--danger);
}

.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}

/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.modal-bg.active {
    display: flex;
}

.modal {
    width: min(450px, 100%);
    background: var(--card);
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.modal h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
}

.form-group input,
.form-group select {
    width: 100%;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
}

.cancel {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
}

.save {
    border: none;
    background: var(--primary);
    color: white;
}

/* THEME MENU */

.theme-menu {
    position: fixed;
    top: 80px;
    right: 4%;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 16px;
    padding: 10px;
    display: none;
    z-index: 5;
}

.theme-menu.active {
    display: block;
}

.theme-option {
    border: none;
    background: transparent;
    color: var(--text);
    padding: 10px 14px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    border-radius: 10px;
}

.theme-option:hover {
    background: var(--primary-light);
}

@media(max-width:600px) {
    header {
        padding-top: 20px;
    }

    .logo {
        font-size: 26px;
    }

    .task {
        padding: 15px;
    }

    .controls {
        align-items: stretch;
    }

    .filters {
        width: 100%;
    }

    .filters select {
        flex: 1;
    }

    .add-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">ödev<span>io</span></div>

        <div class="header-right">
            <button class="icon-btn" onclick="toggleThemeMenu()">🎨</button>
        </div>
    </header>

    <div class="progress-card">

        <div class="progress-top">
            <div class="progress-title">Ödev ilerlemen</div>
            <div class="percent" id="percent">0%</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress-info" id="progressInfo">
            Henüz tamamlanan ödev yok.
        </div>

    </div>

    <div class="controls">

        <div class="filters">

            <select id="subjectFilter" onchange="renderTasks()">
                <option value="all">Tüm dersler</option>
                <option>Matematik</option>
                <option>Seçmeli Matematik</option>
                <option>Türkçe</option>
                <option>Fen Bilimleri</option>
                <option>İnkılap</option>
                <option>İngilizce</option>
            </select>

            <select id="sortFilter" onchange="renderTasks()">
                <option value="nearest">Yakın tarihe göre</option>
                <option value="furthest">Uzak tarihe göre</option>
                <option value="newest">Yeni eklenenler</option>
                <option value="oldest">Eski eklenenler</option>
            </select>

        </div>

        <button class="add-btn" onclick="openModal()">
            + Ödev Ekle
        </button>

    </div>

    <div id="taskList"></div>

</div>


<!-- TEMA -->

<div class="theme-menu" id="themeMenu">

    <button class="theme-option" onclick="setTheme('')">
        🌿 Yeşil
    </button>

    <button class="theme-option" onclick="setTheme('blue')">
        💙 Mavi
    </button>

    <button class="theme-option" onclick="setTheme('purple')">
        💜 Mor
    </button>

    <button class="theme-option" onclick="setTheme('dark')">
        🌙 Koyu
    </button>

</div>


<!-- MODAL -->

<div class="modal-bg" id="modal">

    <div class="modal">

        <h2>Yeni Ödev</h2>

        <div class="form-group">
            <label>Ödev adı</label>
            <input
                type="text"
                id="taskTitle"
                placeholder="Örn. 40 soru paragraf"
            >
        </div>

        <div class="form-group">
            <label>Ders</label>

            <select id="taskSubject">

                <option>Matematik</option>
                <option>Seçmeli Matematik</option>
                <option>Türkçe</option>
                <option>Fen Bilimleri</option>
                <option>İnkılap</option>
                <option>İngilizce</option>

            </select>
        </div>

        <div class="form-group">

            <label>Son teslim tarihi</label>

            <input
                type="date"
                id="taskDate"
            >

        </div>

        <div class="modal-buttons">

            <button class="cancel" onclick="closeModal()">
                Vazgeç
            </button>

            <button class="save" onclick="addTask()">
                Ödevi Ekle
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY = "odevio_simple_tasks";

let tasks = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || [];


// MODAL

function openModal() {
    document.getElementById("modal").classList.add("active");

    document.getElementById("taskTitle").focus();

    // Varsayılan tarih bugün
    const today = new Date().toISOString().split("T")[0];

    document.getElementById("taskDate").value = today;
}

function closeModal() {
    document.getElementById("modal").classList.remove("active");

    document.getElementById("taskTitle").value = "";
}


// ÖDEV EKLE

function addTask() {

    const title =
        document.getElementById("taskTitle").value.trim();

    const subject =
        document.getElementById("taskSubject").value;

    const date =
        document.getElementById("taskDate").value;

    if (!title) {
        alert("Lütfen ödev adını yaz.");
        return;
    }

    if (!date) {
        alert("Lütfen son teslim tarihini seç.");
        return;
    }

    tasks.push({

        id: Date.now(),

        title: title,

        subject: subject,

        date: date,

        completed: false,

        createdAt: Date.now()

    });

    save();

    closeModal();

    renderTasks();
}


// KAYDET

function save() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
    );

}


// TAMAMLAMA

function toggleTask(id) {

    const task = tasks.find(t => t.id === id);

    if (task) {
        task.completed = !task.completed;
    }

    save();

    renderTasks();

}


// SİL

function deleteTask(id) {

    tasks = tasks.filter(
        task => task.id !== id
    );

    save();

    renderTasks();

}


// TARİH

function formatDate(dateString) {

    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString(
        "tr-TR",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


// GÖREVLERİ GÖSTER

function renderTasks() {

    const list =
        document.getElementById("taskList");

    const subject =
        document.getElementById("subjectFilter").value;

    const sort =
        document.getElementById("sortFilter").value;


    let filtered = [...tasks];


    // DERS FİLTRESİ

    if (subject !== "all") {

        filtered = filtered.filter(
            task => task.subject === subject
        );

    }


    // SIRALAMA

    if (sort === "nearest") {

        filtered.sort(
            (a,b) => new Date(a.date) - new Date(b.date)
        );

    }

    if (sort === "furthest") {

        filtered.sort(
            (a,b) => new Date(b.date) - new Date(a.date)
        );

    }

    if (sort === "newest") {

        filtered.sort(
            (a,b) => b.createdAt - a.createdAt
        );

    }

    if (sort === "oldest") {

        filtered.sort(
            (a,b) => a.createdAt - b.createdAt
        );

    }


    if (filtered.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <div style="font-size:40px;margin-bottom:10px">
                    📚
                </div>

                <div>
                    Bu filtreye uygun ödev yok.
                </div>
            </div>
        `;

        updateProgress();

        return;
    }


    list.innerHTML = filtered.map(task => `

        <div class="task ${task.completed ? "completed" : ""}">

            <div
                class="check"
                onclick="toggleTask(${task.id})"
            >
                ${task.completed ? "✓" : ""}
            </div>

            <div class="task-content">

                <div class="task-title">
                    ${escapeHTML(task.title)}
                </div>

                <div class="task-meta">

                    <span class="subject">
                        ${task.subject}
                    </span>

                    <span class="date">
                        📅 ${formatDate(task.date)}
                    </span>

                </div>

            </div>

            <button
                class="delete"
                onclick="deleteTask(${task.id})"
                title="Sil"
            >
                🗑️
            </button>

        </div>

    `).join("");


    updateProgress();

}


// YÜZDE

function updateProgress() {

    const total = tasks.length;

    const completed =
        tasks.filter(task => task.completed).length;


    let percentage = 0;

    if (total > 0) {

        percentage =
            Math.round((completed / total) * 100);

    }


    document.getElementById("percent")
        .textContent = percentage + "%";


    document.getElementById("progressFill")
        .style.width = percentage + "%";


    if (total === 0) {

        document.getElementById("progressInfo")
            .textContent =
            "Henüz eklenmiş ödev yok.";

    } else {

        document.getElementById("progressInfo")
            .textContent =
            `${completed} / ${total} ödev tamamlandı`;

    }

}


// TEMA

function toggleThemeMenu() {

    document
        .getElementById("themeMenu")
        .classList.toggle("active");

}

function setTheme(theme) {

    document.body.className = theme;

    localStorage.setItem(
        "odevio_theme",
        theme
    );

    document
        .getElementById("themeMenu")
        .classList.remove("active");

}


// HTML GÜVENLİĞİ

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// KAYITLI TEMAYI YÜKLE

const savedTheme =
    localStorage.getItem("odevio_theme");

if (savedTheme !== null) {

    document.body.className = savedTheme;

}


// BAŞLAT

renderTasks();


// ESC İLE MODAL KAPAT

document.addEventListener("keydown", e => {

    if (e.key === "Escape") {
        closeModal();
    }

});

</script>

</body>
</html>
