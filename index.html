<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ödevio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f7faf8;
    --surface: #ffffff;
    --surface-2: #f0f5f2;
    --text: #1d2924;
    --muted: #84918b;
    --border: #e4ebe7;

    --primary: #69a98c;
    --primary-dark: #4e8e72;
    --primary-soft: #e2f1ea;

    --danger: #e26d6d;

    --shadow: 0 12px 40px rgba(35, 62, 49, .07);
}


/* THEMES */

body.theme-pink {
    --primary: #d889a5;
    --primary-dark: #c36c8d;
    --primary-soft: #f8e5ed;
    --bg: #fcf7f9;
}

body.theme-blue {
    --primary: #6d9fc8;
    --primary-dark: #5285b1;
    --primary-soft: #e2eff8;
    --bg: #f6f9fc;
}

body.theme-green {
    --primary: #69a98c;
    --primary-dark: #4e8e72;
    --primary-soft: #e2f1ea;
    --bg: #f7faf8;
}

body.theme-yellow {
    --primary: #d5ad51;
    --primary-dark: #bb9137;
    --primary-soft: #f8f0d9;
    --bg: #fcfaf4;
}

body.theme-orange {
    --primary: #df9562;
    --primary-dark: #c87947;
    --primary-soft: #fae9dc;
    --bg: #fcf8f5;
}


body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", sans-serif;
    transition: background .25s ease;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(1180px, calc(100% - 36px));
    margin: auto;
    padding: 28px 0 60px;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 34px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-image {
    width: 58px;
    height: 58px;
    object-fit: contain;
}

.brand-name {
    font-family: "Manrope", sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1.3px;
}

.brand-name span {
    color: var(--primary);
}

.header-actions {
    position: relative;
}

.theme-button {
    width: 56px;
    height: 56px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--surface);
    display: grid;
    place-items: center;
    transition: .2s;
}

.theme-button:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
}

.theme-button img {
    width: 34px;
    height: 34px;
    object-fit: contain;
}


/* =========================
   THEME MENU
========================= */

.theme-menu {
    position: absolute;
    right: 0;
    top: 66px;
    width: 190px;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-7px);
    transition: .2s;
    z-index: 100;
}

.theme-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.theme-choice {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--text);
    text-align: left;
}

.theme-choice:hover {
    background: var(--surface-2);
}

.theme-dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
}

.dot-pink {
    background: #d889a5;
}

.dot-blue {
    background: #6d9fc8;
}

.dot-green {
    background: #69a98c;
}

.dot-yellow {
    background: #d5ad51;
}

.dot-orange {
    background: #df9562;
}


/* =========================
   WELCOME
========================= */

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    font-family: "Manrope", sans-serif;
    font-size: clamp(29px, 4vw, 40px);
    letter-spacing: -1.5px;
    margin-bottom: 7px;
}

.welcome p {
    color: var(--muted);
    font-size: 15px;
}


/* =========================
   DASHBOARD
========================= */

.dashboard {
    display: grid;
    grid-template-columns: 1.4fr .6fr;
    gap: 18px;
    margin-bottom: 35px;
}

.progress-card {
    position: relative;
    overflow: hidden;
    min-height: 215px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 30px;
    box-shadow: var(--shadow);
}

.progress-card::after {
    content: "";
    position: absolute;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: var(--primary-soft);
    right: -85px;
    bottom: -130px;
}

.progress-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
}

.progress-number {
    font-family: "Manrope", sans-serif;
    font-size: 50px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--primary-dark);
    margin-top: 7px;
}

.progress-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
}

.progress-track {
    height: 12px;
    width: 100%;
    background: var(--primary-soft);
    border-radius: 30px;
    overflow: hidden;
    margin-top: 26px;
}

.progress-fill {
    width: 0;
    height: 100%;
    background: var(--primary);
    border-radius: inherit;
    transition: width .5s cubic-bezier(.22,1,.36,1);
}

.stat-card {
    background: var(--primary);
    color: white;
    border-radius: 28px;
    padding: 29px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 215px;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stat-title {
    font-size: 14px;
    opacity: .85;
}

.stat-image {
    width: 58px;
    height: 58px;
    object-fit: contain;
}

.stat-number {
    font-family: "Manrope", sans-serif;
    font-size: 50px;
    font-weight: 800;
    letter-spacing: -2px;
}

.stat-bottom {
    font-size: 13px;
    opacity: .82;
}


/* =========================
   SECTION HEADER
========================= */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.section-title {
    font-family: "Manrope", sans-serif;
    font-size: 21px;
    font-weight: 800;
}

.add-button {
    display: flex;
    align-items: center;
    gap: 9px;
    border: none;
    background: var(--primary);
    color: white;
    padding: 10px 17px 10px 10px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    transition: .2s;
}

.add-button:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.add-button img {
    width: 30px;
    height: 30px;
    object-fit: contain;
}


/* =========================
   SUBJECT GRID
========================= */

.subject-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 17px;
}


/*
   DERSLER ARTIK KARE
*/

.subject-button {
    position: relative;

    width: 100%;
    aspect-ratio: 1 / 1;

    border: 1px solid var(--border);
    border-radius: 25px;

    background: var(--surface);

    color: var(--text);

    box-shadow: var(--shadow);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 18px;

    overflow: hidden;

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.subject-button::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: var(--primary-soft);

    right: -65px;
    bottom: -70px;

    transition: .25s;
}

.subject-button:hover {
    transform: translateY(-5px);

    border-color: var(--primary);

    box-shadow:
        0 18px 42px rgba(35, 62, 49, .12);
}

.subject-button:hover::before {
    transform: scale(1.2);
}


/* BÜYÜK PNG */

.subject-image {
    position: relative;
    z-index: 1;

    width: 92px;
    height: 92px;

    object-fit: contain;

    margin-bottom: 12px;

    transition: transform .22s ease;
}

.subject-button:hover .subject-image {
    transform: scale(1.06);
}

.subject-name {
    position: relative;
    z-index: 1;

    font-family: "Manrope", sans-serif;

    font-size: 16px;

    font-weight: 800;

    line-height: 1.2;

    max-width: 90%;
}

.subject-count {
    position: relative;
    z-index: 1;

    margin-top: 6px;

    color: var(--muted);

    font-size: 11px;
}


/* =========================
   SUBJECT PAGE
========================= */

.subject-page {
    display: none;

    animation: pageIn .35s ease;
}

.subject-page.active {
    display: block;
}

@keyframes pageIn {

    from {
        opacity: 0;
        transform: translateX(18px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}


/*
   KARELİ DEFTER
*/

.notebook {
    position: relative;

    min-height: 620px;

    padding: 38px 42px 55px 65px;

    border-radius: 26px;

    background-color: #fffefb;

    background-image:
        linear-gradient(
            rgba(115, 167, 192, .18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(115, 167, 192, .18) 1px,
            transparent 1px
        );

    background-size: 27px 27px;

    border: 1px solid #e2e4df;

    box-shadow:
        0 15px 50px rgba(40, 55, 50, .09);

    overflow: hidden;
}


/* DEFTERİN SOL ÇİZGİSİ */

.notebook::before {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;
    left: 45px;

    width: 2px;

    background: rgba(220, 120, 120, .25);

    pointer-events: none;
}


/* DEFTER BAŞLIĞI */

.notebook-header {
    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    gap: 20px;

    margin-bottom: 38px;
}

.back-button {
    position: relative;

    flex-shrink: 0;

    width: 45px;
    height: 45px;

    border: 1px solid var(--border);

    border-radius: 13px;

    background: rgba(255,255,255,.88);

    color: var(--text);

    font-size: 22px;

    transition: .2s;
}

.back-button:hover {
    background: var(--primary-soft);

    border-color: var(--primary);

    transform: translateX(-2px);
}

.notebook-subject-image {
    width: 88px;
    height: 88px;

    object-fit: contain;

    background: rgba(255,255,255,.65);

    border-radius: 20px;

    padding: 7px;
}

.notebook-title-area h2 {
    font-family: "Manrope", sans-serif;

    font-size: clamp(25px, 4vw, 34px);

    letter-spacing: -1px;

    margin-bottom: 5px;
}

.notebook-title-area p {
    color: var(--muted);

    font-size: 13px;
}


/* =========================
   NOTEBOOK TASKS
========================= */

.notebook-task-list {
    position: relative;

    z-index: 2;

    display: grid;

    gap: 13px;
}

.notebook-task {
    display: flex;

    align-items: center;

    gap: 14px;

    padding: 16px 18px;

    background: rgba(255,255,255,.82);

    border: 1px solid rgba(210, 218, 214, .8);

    border-radius: 14px;

    box-shadow: 0 4px 15px rgba(50,60,55,.035);

    backdrop-filter: blur(2px);

    transition: .2s;
}

.notebook-task:hover {
    background: rgba(255,255,255,.95);

    transform: translateX(3px);
}

.notebook-task.completed {
    opacity: .58;
}

.notebook-check {
    width: 28px;
    height: 28px;

    flex-shrink: 0;

    border-radius: 8px;

    border: 2px solid var(--primary);

    background: rgba(255,255,255,.8);

    display: grid;
    place-items: center;
}

.notebook-check.checked {
    background: var(--primary);
}

.notebook-check img {
    width: 17px;
    height: 17px;

    object-fit: contain;
}

.notebook-task-info {
    flex: 1;

    min-width: 0;
}

.notebook-task-name {
    font-weight: 700;

    font-size: 14px;

    margin-bottom: 5px;
}

.notebook-task.completed
.notebook-task-name {
    text-decoration: line-through;
}

.notebook-deadline {
    color: var(--muted);

    font-size: 11px;
}

.notebook-deadline.urgent {
    color: var(--danger);

    font-weight: 700;
}

.notebook-delete {
    border: none;

    background: transparent;

    padding: 6px;

    opacity: .45;
}

.notebook-delete:hover {
    opacity: 1;
}

.notebook-delete img {
    width: 22px;
    height: 22px;

    object-fit: contain;
}


/* =========================
   EMPTY NOTEBOOK
========================= */

.notebook-empty {
    position: relative;

    z-index: 2;

    text-align: center;

    padding: 70px 20px;
}

.notebook-empty img {
    width: 105px;
    height: 105px;

    object-fit: contain;

    margin-bottom: 14px;
}

.notebook-empty h3 {
    font-family: "Manrope", sans-serif;

    font-size: 19px;

    margin-bottom: 6px;
}

.notebook-empty p {
    color: var(--muted);

    font-size: 13px;
}


/* =========================
   MODAL
========================= */

.modal-background {
    position: fixed;

    inset: 0;

    background: rgba(19, 27, 24, .42);

    backdrop-filter: blur(5px);

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;

    visibility: hidden;

    transition: .2s;

    z-index: 500;
}

.modal-background.open {
    opacity: 1;

    visibility: visible;
}

.modal {
    width: min(470px, 100%);

    background: var(--surface);

    border-radius: 25px;

    padding: 27px;

    box-shadow: 0 25px 80px rgba(0,0,0,.18);

    transform: translateY(12px) scale(.98);

    transition: .25s;
}

.modal-background.open .modal {
    transform: translateY(0) scale(1);
}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 23px;
}

.modal-title {
    font-family: "Manrope", sans-serif;

    font-size: 22px;

    font-weight: 800;
}

.close-button {
    width: 35px;
    height: 35px;

    border: 1px solid var(--border);

    background: var(--surface-2);

    color: var(--muted);

    border-radius: 10px;

    font-size: 19px;
}

.form-group {
    margin-bottom: 17px;
}

.form-label {
    display: block;

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 7px;
}

.form-input,
.form-select {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: var(--surface);

    color: var(--text);

    outline: none;

    font-size: 14px;
}

.form-input:focus,
.form-select:focus {
    border-color: var(--primary);
}

.modal-actions {
    display: flex;

    gap: 10px;

    margin-top: 23px;
}

.cancel-button,
.save-button {
    flex: 1;

    padding: 13px;

    border-radius: 12px;

    font-size: 13px;

    font-weight: 700;
}

.cancel-button {
    border: 1px solid var(--border);

    background: transparent;

    color: var(--text);
}

.save-button {
    border: none;

    background: var(--primary);

    color: white;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 850px) {

    .dashboard {
        grid-template-columns: 1fr;
    }

    .subject-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .subject-image {
        width: 75px;
        height: 75px;
    }

    .subject-name {
        font-size: 14px;
    }

    .notebook {
        padding-left: 55px;
    }

}


@media (max-width: 650px) {

    .app {
        width: min(100% - 24px, 600px);

        padding-top: 18px;
    }

    .subject-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 13px;
    }

    .subject-button {
        border-radius: 21px;
    }

    .subject-image {
        width: 78px;
        height: 78px;
    }

    .notebook {
        padding:
            25px
            18px
            40px
            48px;

        border-radius: 21px;
    }

    .notebook::before {
        left: 31px;
    }

    .notebook-header {
        gap: 11px;

        margin-bottom: 28px;
    }

    .notebook-subject-image {
        width: 67px;
        height: 67px;
    }

    .notebook-title-area h2 {
        font-size: 23px;
    }

}


@media (max-width: 430px) {

    .header {
        margin-bottom: 25px;
    }

    .brand-image {
        width: 52px;
        height: 52px;
    }

    .brand-name {
        font-size: 25px;
    }

    .theme-button {
        width: 52px;
        height: 52px;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .progress-card,
    .stat-card {
        min-height: 190px;
    }

    .subject-button {
        aspect-ratio: 1 / 1;

        padding: 12px;
    }

    .subject-image {
        width: 70px;
        height: 70px;

        margin-bottom: 9px;
    }

    .subject-name {
        font-size: 13px;
    }

    .subject-count {
        font-size: 10px;
    }

    .notebook {
        padding-left: 43px;
    }

    .notebook::before {
        left: 28px;
    }

    .back-button {
        width: 39px;
        height: 39px;
    }

    .notebook-subject-image {
        width: 58px;
        height: 58px;
    }

    .notebook-title-area h2 {
        font-size: 20px;
    }

    .notebook-title-area p {
        font-size: 11px;
    }

}
</style>
</head>


<body class="theme-green">

<div class="app">


    <!-- =========================
         ANA SAYFA
    ========================== -->

    <main id="homePage">


        <!-- HEADER -->

        <header class="header">

            <div class="brand">

                <img
                    id="logoImage"
                    src="images/logo.png"
                    class="brand-image"
                    alt=""
                >

                <div class="brand-name">
                    ödev<span>io</span>
                </div>

            </div>


            <div class="header-actions">

                <button
                    class="theme-button"
                    onclick="toggleThemeMenu()"
                >

                    <img
                        id="themeImage"
                        src="images/1.png"
                        alt=""
                    >

                </button>


                <div
                    class="theme-menu"
                    id="themeMenu"
                >

                    <button
                        class="theme-choice"
                        onclick="setTheme('pink')"
                    >
                        <span class="theme-dot dot-pink"></span>
                        Pembe
                    </button>

                    <button
                        class="theme-choice"
                        onclick="setTheme('blue')"
                    >
                        <span class="theme-dot dot-blue"></span>
                        Mavi
                    </button>

                    <button
                        class="theme-choice"
                        onclick="setTheme('green')"
                    >
                        <span class="theme-dot dot-green"></span>
                        Yeşil
                    </button>

                    <button
                        class="theme-choice"
                        onclick="setTheme('yellow')"
                    >
                        <span class="theme-dot dot-yellow"></span>
                        Sarı
                    </button>

                    <button
                        class="theme-choice"
                        onclick="setTheme('orange')"
                    >
                        <span class="theme-dot dot-orange"></span>
                        Turuncu
                    </button>

                </div>

            </div>

        </header>


        <!-- WELCOME -->

        <section class="welcome">

            <h1>
                Ödevlerin burada.
            </h1>

            <p>
                Bugünkü işlerini takip et, ilerlemeni gör.
            </p>

        </section>


        <!-- DASHBOARD -->

        <section class="dashboard">


            <div class="progress-card">

                <div class="progress-label">
                    Genel ilerleme
                </div>

                <div
                    class="progress-number"
                    id="progressNumber"
                >
                    0%
                </div>

                <div
                    class="progress-subtitle"
                    id="progressText"
                >
                    Henüz tamamlanan ödev yok.
                </div>

                <div class="progress-track">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-top">

                    <div class="stat-title">
                        Kalan ödev
                    </div>

                    <img
                        id="statImage"
                        src="images/3.png"
                        class="stat-image"
                        alt=""
                    >

                </div>

                <div
                    class="stat-number"
                    id="remainingCount"
                >
                    0
                </div>

                <div class="stat-bottom">
                    Tamamladıkça burası azalır.
                </div>

            </div>


        </section>


        <!-- SUBJECTS -->

        <section>

            <div class="section-header">

                <div class="section-title">
                    Dersler
                </div>

                <button
                    class="add-button"
                    onclick="openModal()"
                >

                    <img
                        id="addImage"
                        src="images/2.png"
                        alt=""
                    >

                    Ödev ekle

                </button>

            </div>


            <div
                class="subject-grid"
                id="subjectGrid"
            ></div>

        </section>

    </main>



    <!-- =========================
         DERS SAYFASI
    ========================== -->

    <main
        id="subjectPage"
        class="subject-page"
    >

        <div class="notebook">


            <div class="notebook-header">


                <button
                    class="back-button"
                    onclick="goHome()"
                    aria-label="Geri"
                >
                    ←
                </button>


                <img
                    id="notebookSubjectImage"
                    class="notebook-subject-image"
                    src=""
                    alt=""
                >


                <div class="notebook-title-area">

                    <h2
                        id="notebookTitle"
                    >
                        Ders
                    </h2>

                    <p
                        id="notebookSubtitle"
                    >
                        Bu derse ait ödevler
                    </p>

                </div>

            </div>


            <div
                class="notebook-task-list"
                id="notebookTaskList"
            ></div>


        </div>

    </main>

</div>



<!-- =========================
     MODAL
========================== -->

<div
    class="modal-background"
    id="modal"
    onclick="backgroundClose(event)"
>

    <div class="modal">


        <div class="modal-header">

            <div class="modal-title">
                Yeni ödev
            </div>

            <button
                class="close-button"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label class="form-label">
                Ödev adı
            </label>

            <input
                class="form-input"
                id="taskTitle"
                type="text"
                placeholder="Örn. 40 soru paragraf"
                maxlength="120"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Ders
            </label>

            <select
                class="form-select"
                id="taskSubject"
            >

                <option>Matematik</option>

                <option>
                    Seçmeli Matematik
                </option>

                <option>Türkçe</option>

                <option>Fen Bilimleri</option>

                <option>İnkılap</option>

                <option>İngilizce</option>

            </select>

        </div>


        <div class="form-group">

            <label class="form-label">
                Son teslim tarihi
            </label>

            <input
                class="form-input"
                id="taskDate"
                type="date"
            >

        </div>


        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="closeModal()"
            >
                Vazgeç
            </button>

            <button
                class="save-button"
                onclick="addTask()"
            >
                Ödevi ekle
            </button>

        </div>


    </div>

</div>



<script>


/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
    "odevio_tasks_v2";

const THEME_KEY =
    "odevio_theme";


let tasks =
    loadTasks();


let currentTheme =
    localStorage.getItem(
        THEME_KEY
    ) || "green";


let currentSubject =
    null;



/* =========================
   THEME IMAGES
========================= */

const themePrefixes = {

    green: "",

    pink: "pembe-",

    blue: "mavi-",

    yellow: "sari-",

    orange: "turuncu-"

};


function getImage(number) {

    return `images/${themePrefixes[currentTheme]}${number}.png`;

}


function getLogoImage() {

    return `images/${themePrefixes[currentTheme]}logo.png`;

}



/* =========================
   SUBJECTS
========================= */

const subjects = [

    {
        name: "Matematik",
        image: 4
    },

    {
        name: "Seçmeli Matematik",
        image: 5
    },

    {
        name: "Türkçe",
        image: 6
    },

    {
        name: "Fen Bilimleri",
        image: 7
    },

    {
        name: "İnkılap",
        image: 8
    },

    {
        name: "İngilizce",
        image: 9
    }

];



/* =========================
   LOAD
========================= */

function loadTasks() {

    try {

        return JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];

    } catch {

        return [];

    }

}


function saveTasks() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
    );

}



/* =========================
   SUBJECT BUTTONS
========================= */

function renderSubjects() {

    const grid =
        document.getElementById(
            "subjectGrid"
        );


    grid.innerHTML =
        subjects.map(subject => {


            const subjectTasks =
                tasks.filter(
                    task =>
                        task.subject ===
                        subject.name
                );


            const count =
                subjectTasks.length;


            const completed =
                subjectTasks.filter(
                    task =>
                        task.completed
                ).length;


            let countText;


            if (count === 0) {

                countText =
                    "Henüz ödev yok";

            } else {

                countText =
                    `${count} ödev · ${completed} tamamlandı`;

            }


            return `

                <button
                    class="subject-button"
                    onclick="openSubject('${subject.name}')"
                >

                    <img
                        class="subject-image"
                        src="${getImage(subject.image)}"
                        alt=""
                    >

                    <div class="subject-name">
                        ${subject.name}
                    </div>

                    <div class="subject-count">
                        ${countText}
                    </div>

                </button>

            `;

        }).join("");

}



/* =========================
   OPEN SUBJECT
========================= */

function openSubject(subjectName) {

    currentSubject =
        subjectName;


    const subject =
        subjects.find(
            item =>
                item.name ===
                subjectName
        );


    if (!subject) return;


    document
        .getElementById(
            "homePage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "subjectPage"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "notebookTitle"
        )
        .textContent =
        subject.name;


    document
        .getElementById(
            "notebookSubjectImage"
        )
        .src =
        getImage(
            subject.image
        );


    renderNotebookTasks();


    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

}



/* =========================
   BACK HOME
========================= */

function goHome() {

    currentSubject =
        null;


    document
        .getElementById(
            "subjectPage"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "homePage"
        )
        .style.display =
        "";


    renderSubjects();


    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

}



/* =========================
   NOTEBOOK TASKS
========================= */

function renderNotebookTasks() {

    const list =
        document.getElementById(
            "notebookTaskList"
        );


    if (!currentSubject) {

        list.innerHTML = "";

        return;

    }


    const subjectTasks =
        tasks
            .filter(
                task =>
                    task.subject ===
                    currentSubject
            )
            .sort(
                (a,b) =>
                    dateValue(a.date) -
                    dateValue(b.date)
            );


    document
        .getElementById(
            "notebookSubtitle"
        )
        .textContent =
        subjectTasks.length === 0
        ? "Henüz bu derse ait ödev yok."
        : `${subjectTasks.length} ödev`;



    if (
        subjectTasks.length === 0
    ) {

        list.innerHTML = `

            <div class="notebook-empty">

                <img
                    src="${getImage(10)}"
                    alt=""
                >

                <h3>
                    Bu sayfa henüz boş.
                </h3>

                <p>
                    Bu derse bir ödev eklediğinde burada görünecek.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML =
        subjectTasks.map(task => {


            const days =
                getDaysLeft(
                    task.date
                );


            const urgent =
                !task.completed &&
                days <= 1;


            return `

                <div
                    class="notebook-task ${
                        task.completed
                        ? "completed"
                        : ""
                    }"
                >


                    <button
                        class="notebook-check ${
                            task.completed
                            ? "checked"
                            : ""
                        }"
                        onclick="toggleTask(${task.id})"
                    >

                        ${
                            task.completed
                            ? `
                                <img
                                    src="${getImage(11)}"
                                    alt=""
                                >
                            `
                            : ""
                        }

                    </button>


                    <div
                        class="notebook-task-info"
                    >

                        <div
                            class="notebook-task-name"
                        >

                            ${escapeHTML(
                                task.title
                            )}

                        </div>


                        <div
                            class="notebook-deadline ${
                                urgent
                                ? "urgent"
                                : ""
                            }"
                        >

                            ${formatDate(
                                task.date
                            )}

                            ·

                            ${deadlineText(
                                task.date
                            )}

                        </div>

                    </div>


                    <button
                        class="notebook-delete"
                        onclick="deleteTask(${task.id})"
                    >

                        <img
                            src="${getImage(12)}"
                            alt=""
                        >

                    </button>


                </div>

            `;

        }).join("");

}



/* =========================
   ADD TASK
========================= */

function addTask() {

    const title =
        document
            .getElementById(
                "taskTitle"
            )
            .value
            .trim();


    const subject =
        document
            .getElementById(
                "taskSubject"
            )
            .value;


    const date =
        document
            .getElementById(
                "taskDate"
            )
            .value;


    if (!title) {

        document
            .getElementById(
                "taskTitle"
            )
            .focus();

        return;

    }


    if (!date) {

        alert(
            "Lütfen son teslim tarihini seç."
        );

        return;

    }


    tasks.push({

        id: Date.now(),

        title,

        subject,

        date,

        completed: false,

        createdAt: Date.now()

    });


    saveTasks();


    closeModal();


    renderSubjects();

    updateStats();


    if (
        currentSubject ===
        subject
    ) {

        renderNotebookTasks();

    }

}



/* =========================
   TOGGLE
========================= */

function toggleTask(id) {

    const task =
        tasks.find(
            item =>
                item.id === id
        );


    if (!task) return;


    task.completed =
        !task.completed;


    saveTasks();


    updateStats();

    renderSubjects();


    if (currentSubject) {

        renderNotebookTasks();

    }

}



/* =========================
   DELETE
========================= */

function deleteTask(id) {

    tasks =
        tasks.filter(
            task =>
                task.id !== id
        );


    saveTasks();


    updateStats();

    renderSubjects();


    if (currentSubject) {

        renderNotebookTasks();

    }

}



/* =========================
   DATE
========================= */

function dateValue(date) {

    return new Date(
        date + "T00:00:00"
    ).getTime();

}


function formatDate(date) {

    return new Date(
        date + "T00:00:00"
    ).toLocaleDateString(
        "tr-TR",
        {
            day: "numeric",
            month: "long"
        }
    );

}


function getDaysLeft(date) {

    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const target =
        new Date(
            date + "T00:00:00"
        );


    return Math.ceil(
        (target - today) /
        86400000
    );

}


function deadlineText(date) {

    const days =
        getDaysLeft(date);


    if (days < 0) {

        return "Süresi geçti";

    }


    if (days === 0) {

        return "Bugün";

    }


    if (days === 1) {

        return "Yarın";

    }


    return `${days} gün kaldı`;

}



/* =========================
   STATS
========================= */

function updateStats() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task =>
                task.completed
        ).length;


    const remaining =
        total - completed;


    const percentage =
        total === 0
        ? 0
        : Math.round(
            completed /
            total *
            100
        );


    document
        .getElementById(
            "progressNumber"
        )
        .textContent =
        percentage + "%";


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percentage + "%";


    document
        .getElementById(
            "remainingCount"
        )
        .textContent =
        remaining;


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        total === 0
        ? "Henüz tamamlanan ödev yok."
        : `${completed} / ${total} ödev tamamlandı`;

}



/* =========================
   MODAL
========================= */

function openModal() {

    document
        .getElementById(
            "modal"
        )
        .classList.add(
            "open"
        );


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    document
        .getElementById(
            "taskDate"
        )
        .value =
        today;


    if (currentSubject) {

        document
            .getElementById(
                "taskSubject"
            )
            .value =
            currentSubject;

    }


    setTimeout(() => {

        document
            .getElementById(
                "taskTitle"
            )
            .focus();

    }, 120);

}


function closeModal() {

    document
        .getElementById(
            "modal"
        )
        .classList.remove(
            "open"
        );


    document
        .getElementById(
            "taskTitle"
        )
        .value = "";

}


function backgroundClose(event) {

    if (
        event.target ===
        document.getElementById(
            "modal"
        )
    ) {

        closeModal();

    }

}



/* =========================
   THEMES
========================= */

function toggleThemeMenu() {

    document
        .getElementById(
            "themeMenu"
        )
        .classList.toggle(
            "open"
        );

}


function setTheme(theme) {

    currentTheme =
        theme;


    document.body.className =
        "theme-" + theme;


    localStorage.setItem(
        THEME_KEY,
        theme
    );


    document
        .getElementById(
            "themeMenu"
        )
        .classList.remove(
            "open"
        );


    updateThemeImages();

}



function updateThemeImages() {

    document
        .getElementById(
            "logoImage"
        )
        .src =
        getLogoImage();


    document
        .getElementById(
            "themeImage"
        )
        .src =
        getImage(1);


    document
        .getElementById(
            "addImage"
        )
        .src =
        getImage(2);


    document
        .getElementById(
            "statImage"
        )
        .src =
        getImage(3);


    renderSubjects();


    if (currentSubject) {

        const subject =
            subjects.find(
                item =>
                    item.name ===
                    currentSubject
            );


        if (subject) {

            document
                .getElementById(
                    "notebookSubjectImage"
                )
                .src =
                getImage(
                    subject.image
                );

        }


        renderNotebookTasks();

    }

}



/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        text;


    return element.innerHTML;

}



/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);



/* =========================
   START
========================= */

document.body.className =
    "theme-" + currentTheme;


updateThemeImages();

updateStats();

</script>

</body>
</html>
