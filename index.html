<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Ödev Takip</title>
<style>
/* ===== MODERN TATLI TEMA ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    background: #f5f7ff;
    background-image: radial-gradient(circle at 0% 0%, #f0f4ff 0%, #faf5ff 100%);
    min-height: 100vh;
    padding: 20px 10px 90px;
    color: #2d3748;
}

.app {
    max-width: 700px;
    margin: 0 auto;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 4px;
}

.title-area h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

.title-area p {
    font-size: 14px;
    color: #8b8fa7;
    font-weight: 500;
    margin-top: 2px;
    -webkit-text-fill-color: #8b8fa7;
}

.add-btn {
    background: #6c5ce7;
    border: none;
    color: white;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 20px;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 6px 0 #4a3f8a;
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

.add-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #4a3f8a;
}

/* ===== PROGRESS KARTI ===== */
.progress-card {
    background: linear-gradient(145deg, #e8edff, #dfe6ff);
    border-radius: 40px;
    padding: 24px 28px;
    margin-bottom: 18px;
    box-shadow: 0 12px 28px rgba(108, 92, 231, 0.15);
    border: 2px solid #ffffff;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.progress-title {
    font-size: 20px;
    font-weight: 800;
    color: #3d3566;
}

.progress-sub {
    font-size: 13px;
    color: #7a72a0;
    font-weight: 500;
    margin-top: 2px;
}

.percent {
    font-size: 34px;
    font-weight: 900;
    color: #6c5ce7;
}

.progress-bar {
    height: 16px;
    background: #d5ddff;
    border-radius: 30px;
    margin-top: 16px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #6c5ce7, #a29bfe);
    border-radius: 30px;
    transition: width 0.4s ease;
}

/* ===== STATS ===== */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
}

.stat {
    background: #ffffff;
    padding: 16px 10px;
    border-radius: 28px;
    text-align: center;
    border: 2px solid #e8edff;
    box-shadow: 0 6px 0 #d5ddff;
}

.stat-number {
    font-size: 26px;
    font-weight: 900;
    color: #3d3566;
}

.stat-label {
    font-size: 12px;
    color: #8b8fa7;
    font-weight: 600;
    margin-top: 2px;
}

/* ===== FİLTRELER ===== */
.filters {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 14px;
    flex-wrap: nowrap;
}

.filters button {
    border: none;
    background: #ffffff;
    color: #6b6f87;
    padding: 10px 20px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
    border: 2px solid #e8edff;
    transition: all 0.15s;
    box-shadow: 0 4px 0 #d5ddff;
    cursor: pointer;
}

.filters button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #d5ddff;
}

.filters button.active {
    background: #6c5ce7;
    border-color: #6c5ce7;
    color: white;
    box-shadow: 0 4px 0 #4a3f8a;
}

/* ===== GÜN BAŞLIĞI ===== */
.day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 4px 12px;
}

.day-header h2 {
    font-size: 20px;
    font-weight: 800;
    color: #3d3566;
    background: #ffffff;
    padding: 4px 16px 4px 12px;
    border-radius: 40px;
    border: 2px solid #e8edff;
}

.day-count {
    font-size: 14px;
    font-weight: 700;
    color: #8b8fa7;
    background: #ffffff;
    padding: 4px 14px;
    border-radius: 40px;
    border: 2px solid #e8edff;
}

/* ===== GÖREV KARTI ===== */
.task {
    background: #ffffff;
    border-radius: 28px;
    padding: 16px 18px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid #e8edff;
    box-shadow: 0 6px 0 #d5ddff;
    transition: all 0.15s ease;
}

.task:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #d5ddff;
}

.task.done {
    opacity: 0.6;
    filter: grayscale(0.15);
}

.task.done .task-title {
    text-decoration: line-through;
    color: #8b8fa7;
}

/* ===== CHECKBOX ===== */
.check {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 12px;
    border: 3px solid #d5ddff;
    background: #f5f7ff;
    cursor: pointer;
    padding: 0;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: white;
}

.check.checked {
    background: #00b894;
    border-color: #00a381;
}

.check.checked::after {
    content: "✓";
}

/* ===== GÖREV BİLGİ ===== */
.task-info {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 16px;
    font-weight: 700;
    color: #2d3748;
    line-height: 1.3;
}

.task-subject {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    color: #8b8fa7;
}

.task-subject span {
    background: #f0f2ff;
    padding: 2px 12px;
    border-radius: 30px;
    display: inline-block;
    margin-top: 2px;
    color: #6c5ce7;
}

/* ===== AKSİYON BUTONLARI ===== */
.task-actions {
    display: flex;
    gap: 6px;
}

.task-action {
    border: none;
    background: #f0f2ff;
    border-radius: 14px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.1s;
    border: 2px solid transparent;
}

.task-action:hover {
    background: #e8edff;
    border-color: #d5ddff;
}

/* ===== BOŞ DURUM ===== */
.empty {
    text-align: center;
    padding: 50px 20px;
    color: #8b8fa7;
    font-size: 18px;
    font-weight: 600;
    background: #ffffff;
    border-radius: 40px;
    border: 3px dashed #d5ddff;
}

.empty span {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
}

/* ===== MODAL ===== */
dialog {
    border: none;
    border-radius: 40px;
    padding: 0;
    width: min(92%, 420px);
    box-shadow: 0 30px 60px rgba(60, 45, 100, 0.2);
    background: #ffffff;
}

dialog::backdrop {
    background: rgba(60, 45, 100, 0.4);
    backdrop-filter: blur(6px);
}

.modal {
    padding: 30px 28px;
}

.modal h2 {
    font-size: 26px;
    font-weight: 800;
    color: #3d3566;
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #6b6f87;
    margin: 14px 0 5px;
}

input, select {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e8edff;
    border-radius: 24px;
    font: inherit;
    font-size: 15px;
    background: #fafbff;
    outline: none;
    transition: border 0.2s;
}

input:focus, select:focus {
    border-color: #6c5ce7;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 24px;
}

.modal-buttons button {
    border: none;
    padding: 13px 24px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
}

.modal-buttons button:first-child {
    background: #f0f2ff;
    color: #6b6f87;
}

.save-btn {
    background: #6c5ce7;
    color: white;
    box-shadow: 0 6px 0 #4a3f8a;
    transition: 0.05s linear;
}

.save-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #4a3f8a;
}

/* ===== RESPONSIVE ===== */
@media(max-width: 520px) {
    .header {
        flex-wrap: wrap;
        gap: 10px;
    }
    .title-area h1 {
        font-size: 26px;
    }
    .add-btn {
        padding: 10px 16px;
        font-size: 14px;
    }
    .progress-card {
        padding: 18px 20px;
    }
    .percent {
        font-size: 28px;
    }
    .stat-number {
        font-size: 22px;
    }
    .task {
        padding: 14px;
        flex-wrap: wrap;
    }
    .task-actions {
        margin-left: auto;
    }
}
</style>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="title-area">
            <h1>🌿 Ödevlerim</h1>
            <p>✨ Her gün biraz daha ileri!</p>
        </div>
        <button class="add-btn" onclick="openAddModal()">
            ✨ Ekle
        </button>
    </div>

    <!-- PROGRESS -->
    <div class="progress-card">
        <div class="progress-top">
            <div>
                <div class="progress-title">💜 İlerleme</div>
                <div class="progress-sub">Tamamladıkça yol alıyorsun 🌱</div>
            </div>
            <div class="percent" id="percent">0%</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">📚 Toplam</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="doneCount">0</div>
            <div class="stat-label">✅ Tamamlanan</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="leftCount">0</div>
            <div class="stat-label">⏳ Kalan</div>
        </div>
    </div>

    <!-- FILTERS -->
    <div class="filters" id="filters"></div>

    <!-- TASK LIST -->
    <div id="taskList"></div>
</div>

<!-- MODAL -->
<dialog id="taskModal">
    <form class="modal" onsubmit="saveTask(event)">
        <h2 id="modalTitle">🌱 Yeni ödev</h2>
        <label>📖 Ders</label>
        <input id="subjectInput" type="text" placeholder="Mesela: Fen" required>
        <label>📝 Ödev</label>
        <input id="titleInput" type="text" placeholder="Ne yapılacak?" required>
        <label>📅 Teslim günü</label>
        <select id="dayInput">
            <option>Pazartesi</option>
            <option>Salı</option>
            <option>Çarşamba</option>
            <option>Perşembe</option>
            <option>Cuma</option>
            <option>Cumartesi</option>
            <option>Pazar</option>
            <option>💭 Belirtilmedi</option>
        </select>
        <input id="editId" type="hidden">
        <div class="modal-buttons">
            <button type="button" onclick="taskModal.close()">Vazgeç</button>
            <button class="save-btn">💾 Kaydet</button>
        </div>
    </form>
</dialog>

<script>
// ===== VERİ =====
const defaultTasks = [
    { id: 1, subject: "Fen", title: "Turuncular", day: "Pazartesi", done: false },
    { id: 2, subject: "Fen", title: "Parkur", day: "Pazartesi", done: false },
    { id: 3, subject: "Fen", title: "Yeşil çerezlik", day: "Salı", done: false },
    { id: 4, subject: "Fen", title: "1. Jet Fasikülü bitir", day: "Belirtilmedi", done: false },
    { id: 5, subject: "Fen", title: "Pembe fotokopi ödevlerini tamamla", day: "Belirtilmedi", done: false },
    { id: 6, subject: "Fen", title: "Fen Jet 1. ve 2. fasikülü yanında bulundur", day: "Belirtilmedi", done: false },
    { id: 7, subject: "Fen", title: "Yazı ödevi", day: "Çarşamba", done: false },
    { id: 8, subject: "Türkçe", title: "40 sayfa paragraf", day: "Belirtilmedi", done: false },
    { id: 9, subject: "İngilizce", title: "345 Yayınları", day: "Pazartesi", done: false },
    { id: 10, subject: "İngilizce", title: "More and More 1. Ünite", day: "Cuma", done: false },
    { id: 11, subject: "Matematik", title: "Fİ Yayınları", day: "Salı", done: false },
    { id: 12, subject: "Matematik", title: "Nartest ilk 6 test", day: "Çarşamba", done: false },
    { id: 13, subject: "Matematik", title: "Nartest kalan 7 test", day: "Perşembe", done: false },
    { id: 14, subject: "Matematik", title: "52 soruluk yeni nesil fotokopi", day: "Cuma", done: false }
];

const STORAGE_KEY = "odev_modern_v1";
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultTasks;
let currentFilter = "Tümü";
const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar", "Belirtilmedi"];

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
}

// ===== RENDER =====
function render() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.done).length;
    const remaining = total - completed;
    const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

    document.getElementById("totalCount").textContent = total;
    document.getElementById("doneCount").textContent = completed;
    document.getElementById("leftCount").textContent = remaining;
    document.getElementById("percent").textContent = percentage + "%";
    document.getElementById("progressFill").style.width = percentage + "%";

    // Filters
    const subjects = ["Tümü", ...new Set(tasks.map(t => t.subject))];
    document.getElementById("filters").innerHTML = subjects.map(s =>
        `<button class="${currentFilter === s ? 'active' : ''}" onclick="setFilter('${escapeHTML(s)}')">${escapeHTML(s)}</button>`
    ).join("");

    // Tasks
    const filtered = tasks.filter(t => currentFilter === "Tümü" || t.subject === currentFilter);
    let html = "";
    days.forEach(day => {
        const dayTasks = filtered.filter(t => t.day === day);
        if (!dayTasks.length) return;
        const done = dayTasks.filter(t => t.done).length;
        html += `<div class="day-header"><h2>🌿 ${day}</h2><span class="day-count">${done}/${dayTasks.length}</span></div>`;
        dayTasks.forEach(task => {
            html += `
            <div class="task ${task.done ? 'done' : ''}">
                <button class="check ${task.done ? 'checked' : ''}" onclick="toggleTask(${task.id})"></button>
                <div class="task-info">
                    <div class="task-title">${escapeHTML(task.title)}</div>
                    <div class="task-subject"><span>${escapeHTML(task.subject)}</span> · ${task.day === "Belirtilmedi" ? "💭 gün belirtilmedi" : "📅 " + task.day}</div>
                </div>
                <div class="task-actions">
                    <button class="task-action" onclick="editTask(${task.id})">✏️</button>
                    <button class="task-action" onclick="deleteTask(${task.id})">🗑️</button>
                </div>
            </div>`;
        });
    });
    document.getElementById("taskList").innerHTML = html || `<div class="empty"><span>🌱</span>Hiç ödev yok, harikasın!</div>`;
}

// ===== CRUD =====
function setFilter(s) { currentFilter = s; render(); }
function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; saveData(); render(); }
}
function openAddModal() {
    document.getElementById("modalTitle").textContent = "🌱 Yeni ödev";
    document.getElementById("editId").value = "";
    document.getElementById("subjectInput").value = "";
    document.getElementById("titleInput").value = "";
    document.getElementById("dayInput").value = "Pazartesi";
    taskModal.showModal();
}
function editTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    document.getElementById("modalTitle").textContent = "✏️ Ödevi düzenle";
    document.getElementById("editId").value = t.id;
    document.getElementById("subjectInput").value = t.subject;
    document.getElementById("titleInput").value = t.title;
    document.getElementById("dayInput").value = t.day;
    taskModal.showModal();
}
function saveTask(e) {
    e.preventDefault();
    const id = Number(document.getElementById("editId").value);
    const subject = document.getElementById("subjectInput").value.trim();
    const title = document.getElementById("titleInput").value.trim();
    const day = document.getElementById("dayInput").value;
    if (!subject || !title) return;
    if (id) {
        const t = tasks.find(t => t.id === id);
        if (t) { t.subject = subject; t.title = title; t.day = day; }
    } else {
        tasks.push({ id: Date.now(), subject, title, day, done: false });
    }
    saveData();
    taskModal.close();
    render();
}
function deleteTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    if (!confirm(`"${t.title}" ödevini silmek istediğine emin misin?`)) return;
    tasks = tasks.filter(t => t.id !== id);
    saveData();
    render();
}

render();
</script>
</body>
</html>
