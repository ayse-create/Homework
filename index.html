<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ödevio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #72b88a;
    --primary-dark: #4d9568;
    --primary-light: #e8f5ec;

    --background: #f6f8f7;
    --surface: #ffffff;
    --surface-2: #f1f4f2;

    --text: #202622;
    --muted: #7d8781;
    --border: #e2e8e4;

    --danger: #e57575;

    --shadow: 0 12px 35px rgba(30, 50, 38, .07);
}

/* TEMALAR */

body.theme-pink {
    --primary: #e58cae;
    --primary-dark: #ca6d91;
    --primary-light: #fcebf2;
}

body.theme-blue {
    --primary: #74a9db;
    --primary-dark: #548bc0;
    --primary-light: #eaf4fc;
}

body.theme-green {
    --primary: #72b88a;
    --primary-dark: #4d9568;
    --primary-light: #e8f5ec;
}

body.theme-yellow {
    --primary: #ddb75f;
    --primary-dark: #c49b3f;
    --primary-light: #fff7df;
}

body.theme-orange {
    --primary: #e4935f;
    --primary-dark: #cc7541;
    --primary-light: #fff0e6;
}

body {
    font-family: "DM Sans", sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s ease;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
    border: none;
}

/* =========================
   HEADER
========================= */

.header {
    width: min(1400px, calc(100% - 40px));
    min-height: 92px;

    margin: 22px auto 0;
    padding: 14px 22px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    box-shadow: var(--shadow);
}

.logo {
    width: auto;
    height: 64px;
    max-width: 220px;
    object-fit: contain;

    transition: transform .25s ease;
}

.logo:hover {
    transform: translateY(-2px);
}

.header-right {
    display: flex;
    align-items: center;
}

.theme-button {
    width: 64px;
    height: 64px;

    border-radius: 19px;
    background: var(--primary-light);

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .25s ease;
}

.theme-button:hover {
    transform: translateY(-2px);
    background: var(--primary);
}

.theme-button img {
    width: 46px;
    height: 46px;
    object-fit: contain;
}

/* =========================
   MAIN
========================= */

.container {
    width: min(1400px, calc(100% - 40px));
    margin: 24px auto 60px;
}

/* =========================
   WELCOME
========================= */

.welcome {
    min-height: 190px;

    padding: 30px 35px;

    margin-bottom: 22px;

    background: var(--primary-light);
    border-radius: 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    overflow: hidden;
}

.welcome-text h1 {
    font-family: "Manrope", sans-serif;
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 800;
    letter-spacing: -1.8px;
}

.welcome-text p {
    color: var(--muted);
    margin-top: 9px;
    font-size: 16px;
}

.welcome-visual {
    width: 210px;
    height: 155px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.welcome-visual img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;

    margin-bottom: 28px;
}

.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 21px;

    padding: 23px;

    box-shadow: var(--shadow);
}

.stat-title {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
}

.stat-number {
    font-family: "Manrope", sans-serif;
    font-size: 34px;
    font-weight: 800;

    margin-top: 6px;
}

.progress {
    height: 9px;

    background: var(--surface-2);
    border-radius: 99px;

    overflow: hidden;
    margin-top: 17px;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: var(--primary);
    border-radius: 99px;

    transition: width .4s ease;
}

/* =========================
   SUBJECTS
========================= */

.section-title {
    font-family: "Manrope", sans-serif;
    font-size: 22px;
    font-weight: 800;

    margin-bottom: 14px;
}

.subjects {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;

    margin-bottom: 27px;
}

.subject-card {
    min-height: 175px;

    padding: 15px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 21px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    cursor: pointer;

    box-shadow: var(--shadow);

    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease;
}

.subject-card:hover {
    transform: translateY(-5px);
    border-color: var(--primary);
}

.subject-card.active {
    border: 2px solid var(--primary);
    background: var(--primary-light);
}

.subject-image {
    height: 115px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.subject-image img {
    width: 105px;
    height: 105px;

    object-fit: contain;

    transition: transform .25s ease;
}

.subject-card:hover .subject-image img {
    transform: scale(1.08);
}

.subject-name {
    text-align: center;

    font-size: 13px;
    font-weight: 700;

    padding-bottom: 3px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    padding: 17px;

    margin-bottom: 18px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 21px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    box-shadow: var(--shadow);
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.select {
    min-width: 165px;

    padding: 12px 14px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: var(--surface);
    color: var(--text);

    outline: none;
}

.select:focus {
    border-color: var(--primary);
}

.add-button {
    min-height: 54px;

    padding: 7px 18px;

    border-radius: 15px;

    background: var(--primary);
    color: white;

    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 700;

    transition: .25s ease;
}

.add-button:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
}

.add-button img {
    width: 39px;
    height: 39px;
    object-fit: contain;
}

/* =========================
   TASK
========================= */

.tasks {
    display: grid;
    gap: 13px;
}

.task {
    padding: 18px 20px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 21px;

    display: grid;
    grid-template-columns: 66px 1fr auto;

    align-items: center;
    gap: 16px;

    box-shadow: var(--shadow);

    transition: .22s ease;
}

.task:hover {
    transform: translateY(-2px);
}

.task.completed {
    opacity: .6;
}

.task.completed .task-title {
    text-decoration: line-through;
}

.task-subject-image {
    width: 66px;
    height: 66px;

    border-radius: 17px;

    background: var(--primary-light);

    display: flex;
    align-items: center;
    justify-content: center;
}

.task-subject-image img {
    width: 55px;
    height: 55px;

    object-fit: contain;
}

.task-title {
    font-size: 16px;
    font-weight: 700;
}

.task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;

    margin-top: 7px;
}

.badge {
    padding: 5px 9px;

    background: var(--primary-light);
    color: var(--primary-dark);

    border-radius: 8px;

    font-size: 12px;
    font-weight: 700;
}

.task-actions {
    display: flex;
    gap: 8px;
}

.check-button,
.delete-button {
    width: 44px;
    height: 44px;

    border-radius: 13px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.check-button {
    background: var(--primary-light);
}

.check-button img {
    width: 34px;
    height: 34px;
    object-fit: contain;
}

.delete-button {
    background: #fff0f0;
    color: var(--danger);

    font-size: 22px;
}

/* =========================
   EMPTY
========================= */

.empty {
    display: none;

    padding: 50px 20px;

    text-align: center;

    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 27px;
}

.empty img {
    width: 180px;
    height: 180px;

    object-fit: contain;

    margin-bottom: 10px;
}

.empty h3 {
    font-family: "Manrope", sans-serif;
    font-size: 21px;
}

.empty p {
    margin-top: 7px;
    color: var(--muted);
}

/* =========================
   MODAL
========================= */

.overlay {
    position: fixed;
    inset: 0;

    background: rgba(20, 25, 22, .38);

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(520px, 100%);

    padding: 28px;

    background: var(--surface);
    border-radius: 27px;

    box-shadow: 0 30px 80px rgba(0,0,0,.18);

    animation: modalIn .25s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 23px;
}

.modal-header h2 {
    font-family: "Manrope", sans-serif;
    font-size: 24px;
}

.close {
    width: 40px;
    height: 40px;

    border-radius: 12px;

    background: var(--surface-2);

    color: var(--text);
    font-size: 21px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;
    font-weight: 700;
}

.input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: var(--surface);
    color: var(--text);

    outline: none;
}

.input:focus {
    border-color: var(--primary);
}

.modal-submit {
    width: 100%;

    padding: 14px;

    border-radius: 14px;

    background: var(--primary);
    color: white;

    font-weight: 700;
}

.modal-submit:hover {
    background: var(--primary-dark);
}

/* =========================
   THEME PANEL
========================= */

.theme-panel {
    position: fixed;

    top: 99px;
    right: 22px;

    padding: 12px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;

    display: none;
    grid-template-columns: repeat(5, 52px);
    gap: 8px;

    box-shadow: 0 20px 50px rgba(0,0,0,.13);

    z-index: 90;
}

.theme-panel.show {
    display: grid;
}

.theme-choice {
    width: 52px;
    height: 52px;

    border-radius: 15px;

    background: var(--surface-2);

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .2s ease;
}

.theme-choice:hover {
    transform: scale(1.08);
}

.theme-choice img {
    width: 39px;
    height: 39px;

    object-fit: contain;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1100px) {

    .subjects {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media (max-width: 720px) {

    .header,
    .container {
        width: calc(100% - 24px);
    }

    .header {
        min-height: 78px;
        padding: 10px 14px;
    }

    .logo {
        height: 54px;
        max-width: 175px;
    }

    .theme-button {
        width: 54px;
        height: 54px;
    }

    .theme-button img {
        width: 39px;
        height: 39px;
    }

    .welcome {
        min-height: 160px;
        padding: 24px;
    }

    .welcome-visual {
        width: 125px;
        height: 115px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .filters {
        width: 100%;
    }

    .select {
        flex: 1;
        min-width: 0;
    }

    .add-button {
        justify-content: center;
    }

    .task {
        grid-template-columns: 58px 1fr;
    }

    .task-subject-image {
        width: 58px;
        height: 58px;
    }

    .task-subject-image img {
        width: 48px;
        height: 48px;
    }

    .task-actions {
        grid-column: 2;
    }

}

@media (max-width: 450px) {

    .subjects {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .subject-card {
        min-height: 155px;
    }

    .subject-image {
        height: 100px;
    }

    .subject-image img {
        width: 90px;
        height: 90px;
    }

    .welcome-visual {
        width: 90px;
        height: 90px;
    }

    .welcome-text h1 {
        font-size: 28px;
    }

    .theme-panel {
        right: 12px;
    }

}

</style>
</head>

<body>

<header class="header">

    <img
        id="logoImage"
        class="logo"
        src="images/logo.png"
        alt="Ödevio">

    <div class="header-right">

        <button
            class="theme-button"
            onclick="toggleThemePanel()">

            <img
                id="themeImage"
                src="images/1.png"
                alt="Tema">

        </button>

    </div>

</header>


<!-- TEMA SEÇİMİ -->

<div id="themePanel" class="theme-panel">

    <button class="theme-choice" onclick="changeTheme('pink')">
        <img src="images/pembe-1.png" alt="Pembe">
    </button>

    <button class="theme-choice" onclick="changeTheme('blue')">
        <img src="images/mavi-1.png" alt="Mavi">
    </button>

    <button class="theme-choice" onclick="changeTheme('green')">
        <img src="images/1.png" alt="Yeşil">
    </button>

    <button class="theme-choice" onclick="changeTheme('yellow')">
        <img src="images/sari-1.png" alt="Sarı">
    </button>

    <button class="theme-choice" onclick="changeTheme('orange')">
        <img src="images/turuncu-1.png" alt="Turuncu">
    </button>

</div>


<main class="container">


    <!-- KARŞILAMA -->

    <section class="welcome">

        <div class="welcome-text">

            <h1>Ödevlerini yönet.</h1>

            <p>
                Bugünkü çalışmalarını düzenli ve kolay
                bir şekilde takip et.
            </p>

        </div>


        <div class="welcome-visual">

            <img
                id="welcomeImage"
                src="images/2.png"
                alt="">

        </div>

    </section>


    <!-- İSTATİSTİKLER -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-title">
                Toplam ödev
            </div>

            <div
                id="totalCount"
                class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Tamamlanan
            </div>

            <div
                id="completedCount"
                class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Tamamlanma
            </div>

            <div
                id="percentage"
                class="stat-number">
                0%
            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>

    </section>


    <!-- DERSLER -->

    <h2 class="section-title">
        Dersler
    </h2>


    <section class="subjects">


        <div
            class="subject-card"
            data-subject="Matematik"
            onclick="selectSubject('Matematik')">

            <div class="subject-image">

                <img
                    data-image="3"
                    src="images/3.png"
                    alt="">

            </div>

            <div class="subject-name">
                Matematik
            </div>

        </div>


        <div
            class="subject-card"
            data-subject="Seçmeli Matematik"
            onclick="selectSubject('Seçmeli Matematik')">

            <div class="subject-image">

                <img
                    data-image="4"
                    src="images/4.png"
                    alt="">

            </div>

            <div class="subject-name">
                Seçmeli Matematik
            </div>

        </div>


        <div
            class="subject-card"
            data-subject="Türkçe"
            onclick="selectSubject('Türkçe')">

            <div class="subject-image">

                <img
                    data-image="5"
                    src="images/5.png"
                    alt="">

            </div>

            <div class="subject-name">
                Türkçe
            </div>

        </div>


        <div
            class="subject-card"
            data-subject="Fen Bilimleri"
            onclick="selectSubject('Fen Bilimleri')">

            <div class="subject-image">

                <img
                    data-image="6"
                    src="images/6.png"
                    alt="">

            </div>

            <div class="subject-name">
                Fen Bilimleri
            </div>

        </div>


        <div
            class="subject-card"
            data-subject="İnkılap"
            onclick="selectSubject('İnkılap')">

            <div class="subject-image">

                <img
                    data-image="7"
                    src="images/7.png"
                    alt="">

            </div>

            <div class="subject-name">
                İnkılap
            </div>

        </div>


        <div
            class="subject-card"
            data-subject="İngilizce"
            onclick="selectSubject('İngilizce')">

            <div class="subject-image">

                <img
                    data-image="8"
                    src="images/8.png"
                    alt="">

            </div>

            <div class="subject-name">
                İngilizce
            </div>

        </div>


    </section>


    <!-- FİLTRELER -->

    <section class="toolbar">

        <div class="filters">

            <select
                id="subjectFilter"
                class="select"
                onchange="renderTasks()">

                <option value="all">
                    Tüm dersler
                </option>

                <option>Matematik</option>
                <option>Seçmeli Matematik</option>
                <option>Türkçe</option>
                <option>Fen Bilimleri</option>
                <option>İnkılap</option>
                <option>İngilizce</option>

            </select>


            <select
                id="sortFilter"
                class="select"
                onchange="renderTasks()">

                <option value="nearest">
                    Teslim tarihi: Yakın
                </option>

                <option value="farthest">
                    Teslim tarihi: Uzak
                </option>

                <option value="newest">
                    Eklenme: Yeni
                </option>

                <option value="oldest">
                    Eklenme: Eski
                </option>

            </select>

        </div>


        <button
            class="add-button"
            onclick="openModal()">

            <img
                id="addImage"
                src="images/2.png"
                alt="">

            <span>
                Ödev ekle
            </span>

        </button>

    </section>


    <!-- ÖDEVLER -->

    <section
        id="tasks"
        class="tasks">
    </section>


    <!-- BOŞ DURUM -->

    <section
        id="empty"
        class="empty">

        <img
            id="emptyImage"
            src="images/3.png"
            alt="">

        <h3>
            Burada henüz bir ödev yok
        </h3>

        <p>
            Yeni bir ödev ekleyerek başlayabilirsin.
        </p>

    </section>

</main>


<!-- MODAL -->

<div
    id="overlay"
    class="overlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                Yeni ödev
            </h2>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <form onsubmit="addTask(event)">

            <div class="form-group">

                <label>
                    Ödev adı
                </label>

                <input
                    id="taskName"
                    class="input"
                    type="text"
                    placeholder="Örneğin: 50 soru matematik"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Ders
                </label>

                <select
                    id="taskSubject"
                    class="input"
                    required>

                    <option value="">
                        Ders seç
                    </option>

                    <option>Matematik</option>
                    <option>Seçmeli Matematik</option>
                    <option>Türkçe</option>
                    <option>Fen Bilimleri</option>
                    <option>İnkılap</option>
                    <option>İngilizce</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Son teslim tarihi
                </label>

                <input
                    id="taskDate"
                    class="input"
                    type="date"
                    required>

            </div>


            <button
                class="modal-submit"
                type="submit">

                Ödevi ekle

            </button>

        </form>

    </div>

</div>


<script>

/* ==================================================
   TEMA SİSTEMİ

   YEŞİL:
   logo.png
   1.png
   2.png
   3.png ...

   PEMBE:
   pembe-logo.png
   pembe-1.png
   pembe-2.png
   pembe-3.png ...

   MAVİ:
   mavi-logo.png
   mavi-1.png
   mavi-2.png
   mavi-3.png ...
================================================== */

const themePrefix = {

    green: "",

    pink: "pembe-",

    blue: "mavi-",

    yellow: "sari-",

    orange: "turuncu-"

};


let currentTheme =
    localStorage.getItem("odevio_theme") || "green";


function image(numberOrName) {

    return `images/${themePrefix[currentTheme]}${numberOrName}.png`;

}


/* TÜM GÖRSELLERİ DEĞİŞTİR */

function updateThemeImages() {

    document.getElementById("logoImage").src =
        image("logo");

    document.getElementById("themeImage").src =
        image("1");

    document.getElementById("welcomeImage").src =
        image("2");

    document.getElementById("addImage").src =
        image("2");

    document.getElementById("emptyImage").src =
        image("3");


    document
        .querySelectorAll("[data-image]")
        .forEach(img => {

            img.src =
                image(img.dataset.image);

        });


    renderTasks();

}


/* TEMAYI UYGULA */

function applyTheme() {

    document.body.className =
        `theme-${currentTheme}`;

    updateThemeImages();

}


/* TEMA DEĞİŞTİR */

function changeTheme(theme) {

    currentTheme = theme;

    localStorage.setItem(
        "odevio_theme",
        currentTheme
    );

    applyTheme();

    document
        .getElementById("themePanel")
        .classList.remove("show");

}


/* TEMA PANELİ */

function toggleThemePanel() {

    document
        .getElementById("themePanel")
        .classList.toggle("show");

}


/* ==================================================
   ÖDEV VERİLERİ
================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem("odevio_tasks")
    ) || [];


/* ==================================================
   MODAL
================================================== */

function openModal() {

    document
        .getElementById("overlay")
        .classList.add("show");

}


function closeModal() {

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* ==================================================
   ÖDEV EKLE
================================================== */

function addTask(event) {

    event.preventDefault();

    const name =
        document
            .getElementById("taskName")
            .value
            .trim();

    const subject =
        document
            .getElementById("taskSubject")
            .value;

    const date =
        document
            .getElementById("taskDate")
            .value;


    if (!name || !subject || !date) {
        return;
    }


    tasks.push({

        id: Date.now(),

        name: name,

        subject: subject,

        date: date,

        completed: false,

        createdAt: Date.now()

    });


    saveTasks();

    event.target.reset();

    closeModal();

    renderTasks();

}


/* ==================================================
   KAYDET
================================================== */

function saveTasks() {

    localStorage.setItem(
        "odevio_tasks",
        JSON.stringify(tasks)
    );

}


/* ==================================================
   TAMAMLANDI
================================================== */

function toggleTask(id) {

    const task =
        tasks.find(
            task => task.id === id
        );

    if (!task) return;

    task.completed =
        !task.completed;

    saveTasks();

    renderTasks();

}


/* ==================================================
   SİL
================================================== */

function deleteTask(id) {

    tasks =
        tasks.filter(
            task => task.id !== id
        );

    saveTasks();

    renderTasks();

}


/* ==================================================
   DERS SEÇ
================================================== */

function selectSubject(subject) {

    document
        .getElementById("subjectFilter")
        .value = subject;


    document
        .querySelectorAll(".subject-card")
        .forEach(card => {

            card.classList.toggle(
                "active",
                card.dataset.subject === subject
            );

        });


    renderTasks();

}


/* ==================================================
   DERS GÖRSEL NUMARASI
================================================== */

function getSubjectImage(subject) {

    const images = {

        "Matematik": "3",

        "Seçmeli Matematik": "4",

        "Türkçe": "5",

        "Fen Bilimleri": "6",

        "İnkılap": "7",

        "İngilizce": "8"

    };

    return images[subject];

}


/* ==================================================
   ÖDEVLERİ GÖSTER
================================================== */

function renderTasks() {

    const container =
        document.getElementById("tasks");

    const empty =
        document.getElementById("empty");


    const subject =
        document
            .getElementById("subjectFilter")
            .value;


    const sort =
        document
            .getElementById("sortFilter")
            .value;


    let filtered =
        [...tasks];


    /* FİLTRE */

    if (subject !== "all") {

        filtered =
            filtered.filter(
                task =>
                    task.subject === subject
            );

    }


    /* SIRALAMA */

    if (sort === "nearest") {

        filtered.sort(
            (a, b) =>
                new Date(a.date) -
                new Date(b.date)
        );

    }


    if (sort === "farthest") {

        filtered.sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    }


    if (sort === "newest") {

        filtered.sort(
            (a, b) =>
                b.createdAt -
                a.createdAt
        );

    }


    if (sort === "oldest") {

        filtered.sort(
            (a, b) =>
                a.createdAt -
                b.createdAt
        );

    }


    container.innerHTML = "";


    if (filtered.length === 0) {

        empty.style.display = "block";

    } else {

        empty.style.display = "none";

    }


    filtered.forEach(task => {

        const card =
            document.createElement("article");


        card.className =
            "task" +
            (task.completed
                ? " completed"
                : "");


        const date =
            new Date(
                task.date + "T00:00:00"
            ).toLocaleDateString(
                "tr-TR",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );


        const subjectImage =
            getSubjectImage(
                task.subject
            );


        card.innerHTML = `

            <div class="task-subject-image">

                <img
                    src="${image(subjectImage)}"
                    alt="">

            </div>


            <div>

                <div class="task-title">

                    ${escapeHtml(task.name)}

                </div>


                <div class="task-meta">

                    <span class="badge">

                        ${escapeHtml(task.subject)}

                    </span>


                    <span class="badge">

                        ${date}

                    </span>

                </div>

            </div>


            <div class="task-actions">

                <button
                    class="check-button"
                    onclick="toggleTask(${task.id})">

                    <img
                        src="${image("2")}"
                        alt="">

                </button>


                <button
                    class="delete-button"
                    onclick="deleteTask(${task.id})">

                    ×

                </button>

            </div>

        `;


        container.appendChild(card);

    });


    updateStats();

}


/* ==================================================
   İSTATİSTİK
================================================== */

function updateStats() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task => task.completed
        ).length;


    const percentage =
        total === 0
            ? 0
            : Math.round(
                completed / total * 100
            );


    document
        .getElementById("totalCount")
        .textContent = total;


    document
        .getElementById("completedCount")
        .textContent = completed;


    document
        .getElementById("percentage")
        .textContent =
            percentage + "%";


    document
        .getElementById("progressBar")
        .style.width =
            percentage + "%";

}


/* ==================================================
   HTML GÜVENLİĞİ
================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ==================================================
   MODAL DIŞINA TIKLAMA
================================================== */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeModal();

            }

        }
    );


/* ==================================================
   BAŞLAT
================================================== */

applyTheme();

</script>

</body>
</html>
